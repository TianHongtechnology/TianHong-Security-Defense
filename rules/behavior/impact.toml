# ── 影响与破坏检测规则 ──
# rule_id 范围：15000-15019

# ── 勒索软件批量加密 ──

[rule]
rule_id = 15000
name = "Ransomware Bulk Encryption"
description = "勒索软件批量加密：短时间内大量文件写入 + 加密扩展名 + C2 通信"
severity = "critical"
threat_class = "Behavior/Ransomware:BulkEncryption.Generic"
version = 1

[rule.detection]
threshold = 80.0
min_match_count = 3
direct_malicious = true

[[rule.detection.indicators]]
id = "BA_IND_FILE_BULK_WRITE"
weight = 40.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_FILE_ENCRYPTED_EXTENSION"
weight = 30.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_NETWORK_C2_CONNECT"
weight = 20.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_PROC_FROM_TEMP_DIR"
weight = 10.0
required = false

---

