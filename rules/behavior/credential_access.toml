# ── 凭据访问检测规则 ──
# rule_id 范围：13000-13014

# ── LSASS 内存读取 ──

[rule]
rule_id = 13000
name = "LSASS Memory Read"
description = "LSASS 内存读取：Mimikatz 等凭据窃取工具行为"
severity = "critical"
threat_class = "Behavior/CredentialAccess:LSASS.Read"
version = 1

[rule.detection]
threshold = 60.0
min_match_count = 2
direct_malicious = true

[[rule.detection.indicators]]
id = "BA_IND_MEM_READ_LSASS"
weight = 50.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_MEM_OPEN_SYSTEM_PROCESS"
weight = 30.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_PROC_FROM_TEMP_DIR"
weight = 10.0
required = false

---

