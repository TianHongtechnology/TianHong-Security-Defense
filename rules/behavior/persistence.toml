# ── 持久化检测规则 ──
# rule_id 范围：11000-11019

# ── Run 键持久化 ──

[rule]
rule_id = 11000
name = "Registry Run Key Persistence"
description = "注册表 Run/RunOnce 键持久化：修改启动项实现开机自启"
severity = "medium"
threat_class = "Behavior/Persistence:RunKey.Generic"
version = 1

[rule.detection]
threshold = 40.0
min_match_count = 2
direct_malicious = false

[[rule.detection.indicators]]
id = "BA_IND_REG_MODIFY_RUN_KEY"
weight = 20.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_FILE_CREATE_SYSTEM_DIR"
weight = 15.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_PROC_FROM_TEMP_DIR"
weight = 10.0
required = false

---

