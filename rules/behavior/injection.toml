# ── 注入与内存操作检测规则 ──
# rule_id 范围：10000-10034
# 对应：g_baProfiles[47-62, 79-89] 注入类画像

# ── PoolParty / 线程池注入检测 ──

[rule]
rule_id = 10000
name = "PoolParty Thread Pool Injection"
description = "PoolParty 线程池注入：通过 NtCreateWorkerFactory 创建 WorkerFactory 并写入回调地址"
severity = "critical"
threat_class = "Behavior/Injection:PoolParty.ThreadPool"
version = 1

[rule.detection]
threshold = 50.0
min_match_count = 2
direct_malicious = true

[[rule.detection.indicators]]
id = "BA_IND_MEM_POOLPARTY_HANDLE_REQUEST"
weight = 10.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_MEM_CROSS_PROCESS_WRITE"
weight = 20.0
required = false

[rule.detection.context]
exclude_parent_name = "windbg.exe"
exclude_parent_name = "x64dbg.exe"
exclude_parent_name = "vsjitdebugger.exe"

[[rule.exceptions]]
image_path = "\\Windows\\system32\\vsjitdebugger.exe"
reason = "VS JIT 调试器"

---

# ── ROP DLL 加载规则 ──

[rule]
rule_id = 10001
name = "DLL Load Via ROP Chain"
description = "DLL 加载通过 ROP 链发起：调用栈含非镜像返回地址"
severity = "high"
threat_class = "Behavior/Injection:DLLLoadViaROP"
version = 1

[rule.detection]
threshold = 40.0
min_match_count = 1
direct_malicious = true

[[rule.detection.indicators]]
id = "BA_IND_IMG_LOAD_VIA_ROP"
weight = 50.0
required = true

[[rule.exceptions]]
image_path = "dotnet.exe"
reason = ".NET CLR JIT 编译"

[[rule.exceptions]]
image_path = "iexplore.exe"
reason = "IE + Chakra JIT"

[[rule.exceptions]]
image_path = "chrome.exe"
reason = "Chrome + V8 JIT"

[[rule.exceptions]]
image_path = "msedge.exe"
reason = "Edge + V8 JIT"

[[rule.exceptions]]
image_path = "powershell.exe"
reason = "PowerShell + .NET JIT"

[[rule.exceptions]]
