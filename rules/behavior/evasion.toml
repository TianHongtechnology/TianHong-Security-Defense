# ── 防御规避检测规则 ──
# rule_id 范围：12000-12024

# ── 禁用恢复控制台 ──

[rule]
rule_id = 12000
name = "Recovery Console Disabled"
description = "禁用恢复控制台：bcdedit 设置 recoveryenabled=No"
severity = "high"
threat_class = "Behavior/Evasion:RecoveryDisable.Generic"
version = 1

[rule.detection]
threshold = 55.0
min_match_count = 1
direct_malicious = false

[[rule.detection.indicators]]
id = "BA_IND_PROC_BCDEDIT_RECOVERY_DISABLE"
weight = 55.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_PROC_FROM_TEMP_DIR"
weight = 10.0
required = false

