# ── 发现与侦察检测规则 ──
# rule_id 范围：14000-14014

# ── 系统信息发现 ──

[rule]
rule_id = 14000
name = "System Information Discovery"
description = "系统信息发现：VM 检测 + 系统枚举 + 账户发现组合"
severity = "medium"
threat_class = "Behavior/Discovery:SystemInfo.Generic"
version = 1

[rule.detection]
threshold = 40.0
min_match_count = 2
direct_malicious = false

[[rule.detection.indicators]]
id = "BA_IND_REG_VM_BIOS_QUERY"
weight = 15.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_REG_VM_TZ_QUERY"
weight = 15.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_REG_SYSTEM_INFO_DISCOVERY"
weight = 20.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_PROC_FROM_TEMP_DIR"
weight = 10.0
required = false

---

# ── 网络侦察 ──

[rule]
rule_id = 14001
name = "Network Reconnaissance"
description = "网络侦察：多目标端口扫描 + 服务发现"
severity = "medium"
threat_class = "Behavior/Discovery:NetworkRecon.Generic"
version = 1

[rule.detection]
threshold = 40.0
min_match_count = 2
direct_malicious = false

[[rule.detection.indicators]]
id = "BA_IND_NET_UNKNOWN_PORT"
weight = 20.0
required = true

[[rule.detection.indicators]]
id = "BA_IND_NET_PROCESS_NETWORK"
weight = 25.0
required = false

[[rule.detection.indicators]]
id = "BA_IND_PROC_HIDDEN_WINDOW"
weight = 10.0
required = false

---

