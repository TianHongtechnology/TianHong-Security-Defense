# ── 网络类指标定义 ──
# BA_IND_NETWORK_C2_CONNECT / BA_IND_NET_* 系列
#
# 注意：这些指标由 Network 驱动通过 ETW 事件自动设置，
# 不依赖 TOML 条件评估。condition_type 设为 "driver_managed" 表示
# 指标由驱动端行为分析引擎自动管理，用户态规则文件仅引用指标 ID。

[indicator]
