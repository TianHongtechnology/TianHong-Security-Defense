# ── R0 HIPS 动态规则补充包 - 注册表部分（来自 dllmain.cpp R3 规则对比补全）
# 覆盖 R3 dllmain.cpp 中有但 R0 内嵌规则未完全覆盖的场景
# rule_id 范围：9301-9320
# 注意：所有规则只覆盖内嵌规则中缺失的操作类型（DELETE）或路径（Wow64/HKCU变体）

# ── Rule 9301: CLSID 完整路径 SET（非 InprocServer32 子项）──
# dllmain.cpp 规则35：内嵌规则#50-51只覆盖InprocServer32子项，此规则覆盖CLSID顶层及非InprocServer32子项
[rule]
rule_id = 9301
name = "CLSID Full Path Set (Non-Inproc)"
description = "拦截 CLSID 注册表完整路径修改（排除已覆盖的 InprocServer32） (T1546.015)"
severity = "high"
threat_class = "Persistence/CLSIDHijack"
version = 1
rule_type = "reg"

[rule.params]
op = "REG_OPERATION_SET"
path = "\\REGISTRY\\MACHINE\\SOFTWARE\\Classes\\CLSID\\*\\*"
value = "*"
flag = "SEF_NOT_SYSTEM_BLOCKED"

---

