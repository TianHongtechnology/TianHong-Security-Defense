# ── HIPS 文件规则 — 完整规则集（来自 ServiceMain.cpp 嵌入式规则）──
# rule_id 范围：201-230
# 加载方式：LoadHipsRules() → IOCTL_ADD_FILE_RULE

# ── 磁盘与系统目录保护 ──

# 1. Physical disk raw write (MBR/VBR protection)
[rule]
rule_id = 201
rule_type = "file"
op = "FILE_OPERATION_WRITE"
path = "\\Device\\PhysicalDrive"
file = "*"
ext = "*"
flag = "SEF_ALL_BLOCKED"
description = "PhysicalDisk write"

---

# 2. Drop exe into System32
[rule]
rule_id = 202
rule_type = "file"
op = "FILE_OPERATION_WRITE"
path = "C:\\Windows\\System32"
file = "*"
ext = "exe"
flag = "SEF_UNSIGNED_BLOCKED"
description = "System32 exe drop"

---

# 3. Drop driver sys into drivers directory
[rule]
rule_id = 203
rule_type = "file"
op = "FILE_OPERATION_WRITE"
path = "C:\\Windows\\System32\\drivers"
file = "*"
ext = "sys"
flag = "SEF_UNSIGNED_BLOCKED"
description = "Drivers sys drop"

---

# 4. Hosts file tampering
[rule]
rule_id = 204
rule_type = "file"
op = "FILE_OPERATION_WRITE"
path = "C:\\Windows\\System32\\drivers\\etc"
file = "hosts"
ext = "*"
flag = "SEF_NOT_SYSTEM_BLOCKED"
description = "Hosts file write"

---

# 5. Common startup folder write
[rule]
rule_id = 205
rule_type = "file"
op = "FILE_OPERATION_WRITE"
path = "C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup"
file = "*"
ext = "*"
flag = "SEF_UNSIGNED_BLOCKED"
description = "Startup folder"

---

