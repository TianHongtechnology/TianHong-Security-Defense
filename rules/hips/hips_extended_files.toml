# ── R0 HIPS 动态规则补充包 - 文件操作部分（来自 dllmain.cpp R3 文件防护）
# R0 minifilter 使用 FltGetFileNameInformation 获取内核规范化路径
# 规则路径使用用户态格式（C:\Users\...），内核自动跳过驱动字母后匹配
# 注意：Raw Disk/MBR 写入由独立的 TianHongHips.Disk 驱动负责，不在此层拦截
# rule_id 范围：9401-9418

# ── Rule 9401: 桌面快捷方式修改 (lnk) ──
# dllmain.cpp NewNtWriteFile: 非explorer修改桌面快捷方式
[rule]
rule_id = 9401
name = "Desktop LNK Write"
description = "拦截非explorer进程修改桌面快捷方式 (T1553.005)"
severity = "medium"
threat_class = "Persistence/DesktopLnk"
version = 1
rule_type = "file"

[rule.params]
op = "FILE_OPERATION_WRITE"
path = "C:\\Users\\*\\Desktop"
file = "*"
ext = "lnk"
flag = "SEF_UNSIGNED_BLOCKED"

---

