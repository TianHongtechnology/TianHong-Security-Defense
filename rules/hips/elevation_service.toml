# ── ElevationService 持久化劫持防护规则 (T1543.003 / T1546.015 / T1574.002)
# 拦截对 Chromium 浏览器 elevation_service 注册表的修改，防止持久化劫持
# rule_id 范围：8001-8007

# ── Rule 8001: Chrome ElevationService CLSID 劫持 (SetValue) ──
[rule]
rule_id = 8001
name = "ElevationService CLSID Hijack Set"
description = "拦截 Chrome ElevationService CLSID {708860E0-*} 注册表修改 (T1546.015)"
severity = "high"
threat_class = "Persistence/ElevationServiceCLSID"
version = 1
rule_type = "reg"

[rule.params]
op = "REG_OPERATION_SET"
path = "\\REGISTRY\\MACHINE\\SOFTWARE\\Classes\\CLSID\\{708860E0-*"
value = "*"
flag = "SEF_NOT_SYSTEM_BLOCKED"

---

# ── Rule 8002: Chrome ElevationService CLSID 劫持 (DeleteValue) ──
[rule]
rule_id = 8002
name = "ElevationService CLSID Hijack Delete"
description = "拦截 Chrome ElevationService CLSID {708860E0-*} 注册表删除 (T1546.015)"
severity = "high"
threat_class = "Persistence/ElevationServiceCLSID"
version = 1
rule_type = "reg"

[rule.params]
op = "REG_OPERATION_DELETE"
path = "\\REGISTRY\\MACHINE\\SOFTWARE\\Classes\\CLSID\\{708860E0-*"
value = "*"
flag = "SEF_NOT_SYSTEM_BLOCKED"

---

