# ── HIPS 注册表规则 — 完整规则集（来自 ServiceMain.cpp 嵌入式规则）──
# rule_id 范围：1-104
# 加载方式：LoadHipsRules() → IOCTL_ADD_RULE
# 注意：此文件覆盖 rules/hips/hips_extended_reg.toml，不再单独加载扩展文件

# ── 自启动与持久化 ──

# 1. HKCU Run key - 用户级自启动
[rule]
rule_id = 1
rule_type = "reg"
op = "REG_OPERATION_SET"
path = "\\REGISTRY\\USER\\*\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run"
value = "*"
flag = "SEF_NOT_SYSTEM_BLOCKED"
description = "HKCU Run"

