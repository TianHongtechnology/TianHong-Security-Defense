# ============================================================
# Sandbox Behavior Chain Rules — 沙盒行为链检测规则（v2 重构）
# ============================================================
# 结构说明：
#   Part 1 单步致命强信号 —— 命中即判定，无需链（MBR 覆写/破坏型）
#   Part 2 通用攻击链 —— 家族共享 TTP，合并重复模板，降低规则冗余
#   Part 3 家族专属链 —— 行为序列有真实区分度的家族（下载器/银行木马/RAT）
#   Part 4 家族签名规则 —— 家族独有指标（加密扩展名/勒索信/外传信道/C2/内存标记）
#   Part 5 银狐脚本行为链 —— 参考 2025-2026 最新银狐攻击流程
#
# 重构动机：
#   旧版把"窃密/勒索"这类行为模板完全相同的家族各写一条 3 步链，
#   导致同一模板重复十几遍，链本身不具家族区分度 → 不适合当行为链。
#   重构后：共同行为收敛为通用链（Part 2），家族独有指标收敛为签名规则（Part 4）。
#
# 格式说明：
#   [[rule]]           — 一条检测规则
#   family             — 家族名称
#   severity           — 严重度（1-100，仅供参考，实际分数由命中步数计算）
#   mode               — 可选：匹配模式
#                        "chain"    = 按链匹配（需按步骤先后顺序命中，默认）
#                        "behavior" = 按行为匹配（仅需各步骤条件被满足，不要求顺序）
#   min_match          — 最少命中的步骤数（1 = 直接命中，无需链）
#   steps              — 步骤数组（按真实行为发生的先后顺序排列）
#     - action         — 行为类型：NetworkConnect / FileWrite / FileRead /
#                        FileOpen / FileClose / FileDelete / ProcessCreate /
#                        ProcessHollowing / RegSetValue / RegRead / RegDelete /
#                        RegSave / BackupDeletion / ServiceStop / SystemConfig /
#                        ReflectionLoad / MemoryAlloc / SchtasksCreate /
#                        WMIRemoteExec / WMICQuery / IEXExecute / Base64Decode /
#                        EnvSet / VarRead / ActiveXObject / NamedPipeConnect /
#                        NamedPipeRead / NamedPipeWrite / RawDiskWrite
#     - pattern        — 可选：target 或 details 中需包含的子串（大小写不敏感）
#     - path_contains  — 可选：target 路径中需包含的子串
#     - path_endswith  — 可选：target 路径后缀匹配
#     - detail_contains — 可选：details 中需包含的子串
#   max_interval       — 可选：相邻步骤最大时间间隔（ticks，默认30）
#
# 解析器约定（重要）：
#   * 本文件由项目内置的简易 TOML 解析器读取（Unquote 仅去除引号，不做转义处理），
#     因此路径中的反斜杠请写成单个 "\"（如 "\run"），不要写成 "\\run"，
#     否则将无法匹配沙盒中记录的 "C:\...\run" 目标。
#   * 每个 step 的值内不能包含英文逗号 ","（解析器以逗号作为字段分隔），
#     多备选请使用 "|" 分隔（如 pattern = "mshta|regsvr32|rundll32"）。
#   * steps = [ 与 ] 必须各占一行；step 对象可单行或跨行，但必须保持 { } 配对。
# ============================================================


# ============================================================
# Part 1 — 单步致命强信号（命中即判定，无需链）
# ============================================================

# ---------- MBR / 磁盘引导覆写 ----------
# 对物理磁盘直接写盘（\Device\Harddisk0 或 dd 命令）＝ 破坏型攻击，一发即致命。
[[rule]]
family = "BSD/Trojan-Dropper.Win32.MBRWriter"
severity = 100
min_match = 1
max_interval = 30
steps = [
    { action = "RawDiskWrite", pattern = "physicaldrive|device\harddisk|dd " },
]

---

# ---------- WinKiller 类破坏型 ----------
# 全盘文件删除 + taskkill + 注册表关键项删除，三重破坏行为组合才判定。
[[rule]]
family = "BSD/Trojan-Dropper.Win32.WinKiller"
severity = 98
min_match = 3
max_interval = 30
steps = [
    { action = "FileDelete", path_contains = "mass_delete|*.*|\efi|x:\" },
    { action = "ProcessCreate", pattern = "taskkill" },
    { action = "RegDelete", pattern = "hku\|hkcr\|hklm\|sam|security|bcd" },
]

---

# ---------- Generic 破坏型（Wiper） ----------
# 裸写盘为致命信号，再叠加删除行为才判定（避免"正常卸载=删文件+删注册表"误报）。
[[rule]]
family = "BSD/Generic.Wiper"
severity = 95
mode = "behavior"
min_match = 2
max_interval = 30
steps = [
    { action = "RawDiskWrite", pattern = "" },
    { action = "FileDelete", pattern = "" },
    { action = "RegDelete", pattern = "" },
]

---

# ============================================================
# Part 2 — 通用攻击链（家族共享 TTP）
# ============================================================

# ---------- Generic: 凭据窃取（合并窃密家族） ----------
# 合并前各家族（行为模板完全相同，链不具区分度，已合并）：
#   LummaStealer / RedLine / Vidar / Raccoon / Stealc / RisePro / MysticStealer /
#   MeduzaStealer / MetaStealer / FickerStealer / Rhadamanthys / AgentTesla /
#   LokiBot / HawkEye / SnakeKeylogger / FormBook / Pony / MarsStealer / AZORult /
#   WarzoneRAT / SilverFox
# 家族特征（用于家族签名规则，见 Part 4.2）：
#   * AgentTesla        — SetWindowsHookEx 键盘记录；SMTP(:587)/FTP(:21)/HTTP 外传（Tor 匿名）
#   * LokiBot/HawkEye   — 键盘/剪贴板记录；SMTP :25/:587 外传
#   * RedLine           — .NET，进程镂空进 regsvcs.exe；wmic 收集系统信息；面板外传
#   * LummaStealer      — 覆盖 80+ 浏览器/70+ 钱包；C2 域名轮换；外传伪装 .png/.gif
#   * Stealc            — 模块化构建；浏览器凭据 + 钱包
#   * RisePro/Meduza/Meta/Ficker — 经 Telegram API 外传
#   * Rhadamanthys      — AI OCR 识别钱包助记词
#   * Raccoon v2        — 会话 Cookie（绕过 MFA）；FTP 外传
#   * Vidar             — Steam/Telegram/GitHub 等公开平台 dead-drop 配置拉取
[[rule]]
family = "BSD/Generic.CredentialTheft"
severity = 88
mode = "behavior"
min_match = 3
max_interval = 30
steps = [
    { action = "FileRead", path_contains = "login data|cookies|web data|key4.db|logins.json|wallet|autofill|leveldb" },
    { action = "FileWrite", path_endswith = ".zip|.7z|.rar|.txt|.log|.bin" },
    { action = "NetworkConnect", pattern = "http|ftp|smtp|telegram|discord|:443|:21|:25|:587|.php" },
]

---

# ---------- Generic: 勒索加密（合并勒索家族） ----------
# 合并前各家族（加密扩展名/勒索信/卷影破坏，模板相同，链不具区分度，已合并）：
#   LockBit / Conti / REvil / BlackCat / Hive / DarkSide / Clop / Ryuk / BlackMatter /
#   Pysa / Maze / Egregor / Akira / BlackBasta / Royal / AvosLocker / RansomEXX /
#   Play / Cuba / ViceSociety
# 家族特征（加密扩展名指纹 → Part 4.1 单步签名规则）：
#   * LockBit 3.0/Black — .lockbit，新版本随机 16 位扩展名；{扩展名}.README 勒索信
#   * Akira / BlackBasta / BlackCat / Hive / Royal / Play 等均为 RaaS，双重重吓
#   * BlackBasta        — .basta；*-README.txt / HOW_TO_DECRYPT.txt；ChaCha20+RSA-4096
#   * BlackCat(ALPHV)   — .blackcat；.onion 泄漏站
#   * 卷影破坏 / 备份删除 / 关闭服务为共同 TTP，由本通用链兜底
[[rule]]
family = "BSD/Generic.RansomwareEncryptor"
severity = 92
mode = "behavior"
min_match = 3
max_interval = 30
steps = [
    { action = "FileWrite", path_contains = "desktop|documents|downloads|pictures" },
    { action = "FileDelete", pattern = "" },
    { action = "BackupDeletion", pattern = "" },
]

