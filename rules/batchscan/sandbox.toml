# ============================================================
# Part 5 — 银狐（SilverFox）脚本行为链
# 参考 2025-2026 最新银狐攻击流程（火绒/瑞星/安天等报告）：
#   投递（伪 WPS/Chrome/播放器安装包、.scr、群文件）
#   → VBS/JS 拉起编码 PowerShell
#   → 无文件下载器从云盘/Telegram/HTTP 拉载荷
#   → 释放 DLL 白加黑侧载（rundll32/regsvr32）
#   → BYOVD(合法签名驱动)+taskkill/sc 终止安全软件；Defender 排除 C:~F:
#   → 伪装系统更新的计划任务（SYSTEM 每分钟）/ WMI 事件订阅持久化
#   → 窃取浏览器凭据/键盘记录/微信钉钉聊天 → 打包 ZIP 经 Telegram/HTTP/云盘外传
#   → DoH(223.5.5.5/8.8.8.8)或硬编码 IP(如 8.218.106.149:7000) C2 获取指令
# 每条规则为“有序行为链”，需按顺序命中 min_match 步才判定，降低误杀。
# ============================================================

# ---------- 银狐 1：VBS/JS 拉起编码 PowerShell 执行 ----------
[[rule]]
family = "BSD/Trojan-Dropper.Script.SilverFox.EncodedPS"
severity = 88
min_match = 3
max_interval = 30
steps = [
    { action = "ProcessCreate", pattern = "powershell" },
    { action = "Base64Decode", pattern = "iex|.net" },
    { action = "IEXExecute", pattern = "" },
]

---

# ---------- 银狐 2：无文件下载器（下载→落地→执行） ----------
# 载荷常来自阿里云 OSS / Telegram / GitHub raw，落地到临时目录后用 LOLBin 执行。
[[rule]]
family = "BSD/Trojan-Downloader.Script.SilverFox.FilelessDropper"
severity = 86
min_match = 3
max_interval = 30
steps = [
    { action = "NetworkConnect", pattern = "http|aliyuncs|oss|telegram|raw.githubusercontent" },
    { action = "FileWrite", path_contains = "\temp|\appdata|\programdata|public", path_endswith = ".exe|.dll|.bin|.dat|.ps1|.vbs" },
    { action = "ProcessCreate", pattern = "powershell|rundll32|regsvr32|mshta|wscript|cmd" },
]

---

# ---------- 银狐 3：释放 DLL 白加黑侧载 ----------
# 合法 EXE(白) + 同名恶意 DLL(黑) 落地后由 rundll32/regsvr32 加载。
[[rule]]
family = "BSD/Trojan-Dropper.Script.SilverFox.DllSideload"
severity = 85
min_match = 2
max_interval = 30
steps = [
    { action = "FileWrite", path_contains = "temp|appdata|programdata|public", path_endswith = ".dll" },
    { action = "ProcessCreate", pattern = "rundll32|regsvr32" },
]

---

# ---------- 银狐 4：防御规避（Defender 排除 + 终止安全软件 + BYOVD） ----------
# PowerShell 将 C:~F: 加入 Defender 排除列表；taskkill/sc 或 BYOVD 终止安全软件进程。
[[rule]]
family = "BSD/Evasion.Script.SilverFox.DisableAV"
severity = 90
min_match = 3
max_interval = 30
steps = [
    { action = "RegSetValue", pattern = "defender" },
    { action = "ProcessCreate", pattern = "taskkill" },
    { action = "ServiceStop", pattern = "" },
]

---

# ---------- 银狐 5：落地脚本 + 隐藏计划任务持久化（伪装系统更新） ----------
# 计划任务伪装为 Edge/系统更新，SYSTEM 权限周期触发。
[[rule]]
family = "BSD/Persistence.Script.SilverFox.ScheduledTask"
severity = 86
min_match = 3
max_interval = 30
steps = [
    { action = "FileWrite", path_contains = "temp|appdata", path_endswith = ".bat|.cmd|.vbs|.ps1|.dll" },
    { action = "SchtasksCreate", detail_contains = "/tn|/tr|/sc|register-scheduledtask" },
    { action = "ProcessCreate", pattern = "powershell|rundll32|mshta|wscript|regsvr32|cmd" },
]

---

# ---------- 银狐 6：WMI 远程执行 / 事件订阅持久化 ----------
[[rule]]
family = "BSD/Persistence.Script.SilverFox.WMIExec"
severity = 86
min_match = 3
max_interval = 30
steps = [
    { action = "WMIRemoteExec", pattern = "" },
    { action = "ProcessCreate", pattern = "powershell|cmd|wscript|cscript" },
    { action = "NetworkConnect", pattern = "http|:445|:135" },
]

---

# ---------- 银狐 7：窃取浏览器凭据并打包 ----------
# 读取浏览器 Login Data/Cookies/钱包，读取注册表凭据，打包 ZIP。
[[rule]]
family = "BSD/Trojan-Spy.Script.SilverFox.BrowserStealer"
severity = 88
min_match = 3
max_interval = 30
steps = [
    { action = "FileRead", path_contains = "login data|cookies|web data|key4.db|logins.json|autofill" },
    { action = "RegRead", path_contains = "credential|password|login" },
    { action = "FileWrite", path_endswith = ".zip|.7z|.rar" },
]

---

# ---------- 银狐 8：打包窃取数据并经 Telegram/HTTP 外传 ----------
# 收紧：第一步限定读取的是敏感数据文件，避免任意 FileRead 误触发。
[[rule]]
family = "BSD/Trojan-Spy.Script.SilverFox.Exfil"
severity = 88
min_match = 3
max_interval = 30
steps = [
    { action = "FileRead", path_contains = "login data|cookies|wallet|browser|document|desktop|downloads|chat|wechat|weixin|dingtalk" },
    { action = "FileWrite", path_endswith = ".zip|.7z|.rar" },
    { action = "NetworkConnect", pattern = "api.telegram.org|telegram|/send|http|ftp|:443" },
]

---

# ---------- 银狐 9：键盘记录 + 反射加载（远控能力） ----------
# 键盘/剪贴板记录 + 反射式 DLL 加载 + 回连 C2。
[[rule]]
family = "BSD/Backdoor.Script.SilverFox.KeylogReflective"
severity = 87
min_match = 3
max_interval = 30
steps = [
    { action = "MemoryAlloc", detail_contains = "getasynckeystate|keylog|hook|clipboard" },
    { action = "ReflectionLoad", pattern = "" },
    { action = "NetworkConnect", pattern = "http|:443|:7000" },
]

---

# ---------- 银狐 10：C2 通信（DoH/云端/硬编码 IP）获取指令并执行 ----------
# 硬编码 C2(如 8.218.106.149:7000) 或 DoH(223.5.5.5/8.8.8.8) 拉取编码指令后 IEX 执行。
[[rule]]
family = "BSD/Backdoor.Script.SilverFox.C2"
severity = 88
min_match = 3
max_interval = 30
steps = [
    { action = "NetworkConnect", pattern = "http|:443|:7000|aliyuncs|oss|223.5.5.5|8.8.8.8" },
    { action = "Base64Decode", pattern = "" },
    { action = "IEXExecute", pattern = "" },
]
