# ============================================================
# K. HTA / LNK 补充
# ============================================================

[[rule]]
family = "BSD/TrojanDownloader.HTA.PowershellIEX"
severity = 90
description = "HTA runs PowerShell IEX download cradle"
patterns = ["hta:application", "powershell", "iex|invoke-expression|downloadstring|http"]
exclude_patterns = ["<html>", "<head>"]
min_size = 0
max_size = 5242880
language_hint = "hta"

---
[[rule]]
family = "BSD/Trojan.HTA.MsiexecSilentInstall"
