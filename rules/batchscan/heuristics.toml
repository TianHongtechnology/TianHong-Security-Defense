# ============================================================
# L. 通用 / 跨语言补充（Generic）
# ============================================================

[[rule]]
family = "BSD/Evasion.Generic.AntiVM"
severity = 74
description = "Script checks for VM/sandbox processes or services"
patterns = ["vmtoolsd|vboxservice|vbox|vmware|virtualbox|qemu|sandboxie", "getprocess|wmic|wmiobject|tasklist|get-service"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "all"

---
[[rule]]
family = "BSD/TrojanSpy.Generic.BrowserCredSteal"
severity = 90
description = "Script copies browser credential DBs, archives them, and exfiltrates via upload"
patterns = ["login data|cookies|web data|key4.db|logins.json", "copy-item|copyfile|file.copy|compress-archive|zipfile|zip::|7z ", "invoke-webrequest|webclient|xmlhttp|upload|webhook|api.telegram|discord.com|send-mailmessage|smtp"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "all"

