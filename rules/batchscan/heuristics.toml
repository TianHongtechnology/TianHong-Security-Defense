---
[[rule]]
family = "BSD/TrojanDropper.VBS.FSOWriteRun"
severity = 82
description = "VBS writes script/dropper via FSO then executes"
# 要求写出目标为脚本文件（.ps1/.bat/.cmd/.vbs/.js/.hta 等）才判定投毒；
# 系统诊断脚本仅把系统信息写入 .txt/.log 报告再 shell.Run 收集，不涉及脚本文件。
patterns = ["scripting.filesystemobject", "createtextfile|opentextfile|writeline|write", "wscript.shell", ".ps1|.bat|.cmd|.vbs|.js|.hta|.vbe|.jse"]
exclude_patterns = []
