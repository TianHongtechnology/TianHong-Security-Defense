---
[[rule]]
family = "BSD/TrojanSpy.PS.CredentialDump"
severity = 92
description = "PowerShell credential dumping (Mimikatz / LSASS techniques)"
# 仅匹配 Mimikatz 强信号；不再单匹配 "lsass"（系统诊断脚本常以 lsass.exe 命名 ETW 追踪注册表键）。
# LSASS 内存转储（procdump/minidump/comsvcs）由 LsassMiniDump 规则单独覆盖。
patterns = ["sekurlsa|logonpasswords|kerberos::|invoke-mimikatz|mimikatz"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "ps1"

