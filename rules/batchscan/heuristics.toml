# ============================================================
# Heuristics Rules — 静态内容指纹规则（启发式检测）
# ============================================================
# 生产级规则库说明：
#   * 匹配语义：所有 patterns 必须同时命中（AND）；
#     单个 pattern 内用 "|" 分隔多个备选（任一命中即算命中）。
#   * exclude_patterns：命中任一即跳过整条规则（降低误报）。
#   * min_size / max_size：文件大小范围（字节），超出范围不匹配。
#   * language_hint：仅供标注，实际不参与匹配（内容指纹对语言无关）。
#   * 严重度 severity：1-100，越高越危险。
#
# 编写原则：
#   - 每条规则为“精确组合”，单个特征词不足以定论，组合后才构成强信号；
#   - 优先覆盖下载执行、持久化、凭据窃取、反病毒绕过、勒索、挖矿等高危行为。
#
# 解析器约定（重要）：
#   * 本文件由项目内置的简易 TOML 解析器读取（仅去除引号、不做转义处理），
#     因此字符串中的反斜杠请写成单个 "\"（如 "hklm\sam"），不要写成 "\\"，
#     否则无法匹配脚本内容中真实的单反斜杠路径。
#   * patterns 数组可单行或跨行；每个元素内用 "|" 分隔多个备选，任一命中即命中。
# ============================================================

# ============================================================
# A. PowerShell
# ============================================================

[[rule]]
family = "BSD/TrojanDownloader.PS.EncodedDownloadCradle"
severity = 92
description = "Encoded PowerShell download-and-execute cradle"
patterns = ["-enc|encodedcommand", "iex|invoke-expression", "downloadstring|downloadfile|webclient"]
exclude_patterns = []
min_size = 0
max_size = 5242880
language_hint = "ps1"

---
[[rule]]
family = "BSD/TrojanDropper.PS.IEXBase64Gzip"
severity = 90
description = "PowerShell IEX + Base64 + GZip decompression payload"
patterns = ["iex|invoke-expression", "decompress", "frombase64string"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "ps1"

---
[[rule]]
family = "BSD/TrojanDropper.PS.Base64DecodeRun"
severity = 86
description = "PowerShell decodes Base64 string then executes via IEX"
patterns = ["frombase64string", "utf8.getstring", "iex|invoke-expression"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "ps1"

---
[[rule]]
family = "BSD/TrojanDropper.PS.ShellcodeInjection"
