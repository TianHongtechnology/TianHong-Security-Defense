---
[[rule]]
family = "BSD/Ransomware.PS.ScriptEncryptor"
severity = 92
description = "PowerShell script ransomware: recurse and encrypt files"
patterns = ["get-childitem|gci", "-recurse", "aes|rijndael|encryptstring|set-content"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "ps1"

---

# ============================================================
# I. CMD / LOLBins
# ============================================================

[[rule]]
family = "BSD/TrojanDownloader.CMD.PowershellCradle"
severity = 88
description = "Batch launches PowerShell download-and-execute cradle"
patterns = ["powershell", "-c|command", "iex|invoke-expression|downloadstring"]
exclude_patterns = []
min_size = 0
max_size = 1048576
language_hint = "cmd"

---
[[rule]]
family = "BSD/TrojanDropper.CMD.MsbuildExec"
severity = 84
description = "Batch executes payload via MSBuild project file"
patterns = ["msbuild", ".csproj|.xml", "http|powershell"]
exclude_patterns = []
min_size = 0
max_size = 1048576
language_hint = "cmd"

---
[[rule]]
family = "BSD/TrojanDownloader.CMD.MshtaRemote"
severity = 85
description = "Batch executes remote HTA via mshta"
patterns = ["mshta", "http"]
exclude_patterns = []
min_size = 0
max_size = 1048576
language_hint = "cmd"

---
[[rule]]
family = "BSD/Trojan.CMD.ShadowCopyDisable"
severity = 86
description = "Batch disables/deletes Volume Shadow Copies (ransomware prep)"
patterns = ["vssadmin", "delete shadows|resize shadowstorage"]
exclude_patterns = []
min_size = 0
max_size = 1048576
language_hint = "cmd"

---
[[rule]]
family = "BSD/Evasion.CMD.ExecutionPolicyBypass"
severity = 82
description = "Batch invokes PowerShell with execution policy bypass"
patterns = ["powershell", "bypass", "-executionpolicy|-ep"]
exclude_patterns = []
min_size = 0
max_size = 1048576
language_hint = "cmd"

---
[[rule]]
family = "BSD/TrojanDropper.CMD.Regsvr32Scrobj"
severity = 86
description = "Batch runs scriptlet via regsvr32 scrobj.dll"
patterns = ["regsvr32", "scrobj.dll", "/s|/i"]
exclude_patterns = []
min_size = 0
max_size = 1048576
language_hint = "cmd"

---

