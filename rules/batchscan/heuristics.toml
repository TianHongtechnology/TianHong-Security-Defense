[[rule]]
family = "BSD/TrojanDropper.PS.ReflectiveAssemblyLoad"
severity = 88
description = "PowerShell reflectively loads assembly AND downloads/decodes/executes it"
# 第一组要求 "::load("（内存字节加载），排除 LoadWithPartialName（系统诊断脚本加载组件）；
# 第二组仅保留真实下载/解码原语，去掉宽泛的 invoke-expression/iex/http 以免误报网络诊断脚本。
patterns = ["[reflection.assembly]::load(|[reflection.assembly]::loadfrom|[reflection.assembly]::loadfile|invoke-assembly|unmanagedpowershell", "downloadstring|downloadfile|webclient|frombase64string|start-bitstransfer"]
exclude_patterns = []
min_size = 0
max_size = 10485760
language_hint = "ps1"

